# Access log in Apache "combined" format, written to the shared /logs volume
# so the detector container can tail it. This mirrors a real SIEM collection
# point: all request telemetry lands in one predictable place.
log_format combined_plus '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /logs/access.log combined_plus;
    error_log  /logs/error.log warn;

    location / {
        proxy_pass http://dvwa:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
